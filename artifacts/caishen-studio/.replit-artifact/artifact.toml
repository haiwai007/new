kind = "web"
previewPath = "/"
title = "海神作图在线平台"
description = "A browser-based image design platform for creating editable, reusable artwork from uploaded images and templates. This continuation imports the existing local-first editor and completes CSV-driven batch generation with downloadable ZIP output."
version = "1.0.0"
id = "artifacts/caishen-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25706

[services.development]
run = "pnpm --filter @workspace/caishen-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caishen-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/caishen-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25706"
BASE_PATH = "/"
