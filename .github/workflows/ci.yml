name: Validate studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-ocr.mjs
      - run: pnpm typecheck
      - run: pnpm --filter @workspace/caishen-studio test
      - run: pnpm --filter @workspace/caishen-studio exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/caishen-studio build
      - run: pnpm --filter @workspace/caishen-studio test:e2e
        env:
          E2E_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failure
          path: artifacts/caishen-studio/test-results
          if-no-files-found: ignore
