# Static frontend only. TLS is terminated by the public reverse proxy / hosting layer.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;

    # Keep the entry document fresh. Locations deliberately use expires rather
    # than add_header, so the security headers above continue to be inherited.
    location = /index.html {
        expires -1;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    # /templates is also an application page, not a directory listing.
    location = /templates {
        rewrite ^ /index.html last;
    }
    location = /templates/ {
        rewrite ^ /index.html last;
    }
    location ^~ /templates/ {
        try_files $uri =404;
        expires 1h;
    }
    location ^~ /licenses/ {
        try_files $uri =404;
        expires 1h;
    }
    location ^~ /attributions/ {
        try_files $uri =404;
        expires 1h;
    }
    # Tesseract expects the actual .gz model bytes. Never label an already
    # compressed file as Content-Encoding: gzip without wrapping it correctly.
    location ~ \.traineddata\.gz$ {
        types { }
        default_type application/octet-stream;
        gzip off;
        try_files $uri =404;
        expires 1h;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
        expires 1h;
    }
    location /ocr/ {
        try_files $uri =404;
        expires 1h;
    }
    # Missing static files must not turn into an index.html response.
    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|ico|gz|json|txt|map)$ {
        try_files $uri =404;
        expires 1h;
    }
    # History API routes: preserve the original browser URL and its OIDC query.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
